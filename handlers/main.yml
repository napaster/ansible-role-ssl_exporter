---
- name: "ssl_exporter | Reload systemd daemons"
  ansible.builtin.systemd:
    daemon_reload: "yes"
  listen: "Daemon reload"
- name: "ssl_exporter | Restart ssl_exporter service"
  ansible.builtin.systemd:
    name: "{{ lookup('ansible.builtin.vars', 'ssl_exporter_service') }}"
    state: "restarted"
  listen: "Restart ssl_exporter"
  when:
    - "lookup('ansible.builtin.vars', 'ssl_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'ssl_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'ssl_exporter_restart', default='')) == 'true'"
  vars:
    ssl_exporter_restart: "[] | map(&restart || 'false', @) | [0]"
