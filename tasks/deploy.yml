---
- name: "ssl_exporter | Deploy ssl_exporter options configuration [package
    deployment]"
  ansible.builtin.template:
    src: "ssl_exporter.options.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'ssl_exporter_options_dest') }}"
    owner: "root"
    group: "root"
    mode: "0644"
  when:
    - "lookup('ansible.builtin.vars', 'ssl_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'ssl_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'ssl_exporter_install_package', default='')) == 'true'"
  vars:
    ssl_exporter_install_package: "[] |
      map(&install_package || 'false', @) | [0]"
  notify:
    - "Restart ssl_exporter"
- name: "ssl_exporter | Deploy ssl_exporter modules [package deployment]"
  ansible.builtin.template:
    src: "ssl_exporter.yml.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'ssl_exporter_yaml_dest') }}"
    owner: "root"
    group: "root"
    mode: "0644"
  when:
    - "lookup('ansible.builtin.vars', 'ssl_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'ssl_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'ssl_exporter_install_package', default='')) == 'true'"
  vars:
    ssl_exporter_install_package:
      "[] | map(&install_package || 'false', @) | [0]"
  notify:
    - "Restart ssl_exporter"
- name: "ssl_exporter | Deploy ssl_exporter modules [not package deployment]"
  ansible.builtin.template:
    src: "ssl_exporter.yml.j2"
    dest: "{{ lookup('ansible.builtin.vars', 'ssl_exporter_dest') +
      '/ssl_exporter.yml' }}"
    owner: "root"
    group: "root"
    mode: "0644"
  when:
    - "lookup('ansible.builtin.vars', 'ssl_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'ssl_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'ssl_exporter_install_package', default='')) == 'false'"
  vars:
    ssl_exporter_install_package:
      "[] | map(&install_package || 'false', @) | [0]"
  notify:
    - "Restart ssl_exporter"
- name: "ssl_exporter | Deploy ssl_exporter service configuration [not
    package deployment]"
  ansible.builtin.template:
    src: "ssl_exporter.service.j2"
    dest: "{{ '/etc/systemd/system/' + lookup('ansible.builtin.vars',
      'ssl_exporter_service') + '.service' }}"
    owner: "root"
    group: "root"
    mode: "0644"
  when:
    - "lookup('ansible.builtin.vars', 'ssl_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'ssl_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'ssl_exporter_install_package', default='')) == 'false'"
  vars:
    ssl_exporter_install_package: "[] |
      map(&install_package || 'false', @) | [0]"
  notify:
    - "Daemon reload"
    - "Restart ssl_exporter"
- name: "ssl_exporter | Enable ssl_exporter service"
  ansible.builtin.systemd:
    name: "{{ lookup('ansible.builtin.vars', 'ssl_exporter_service') }}"
    enabled: "yes"
  when:
    - "lookup('ansible.builtin.vars', 'ssl_exporter', default='')
      not in ['', [], '[]', None]"
    - "lookup('ansible.builtin.vars', 'ssl_exporter') |
       community.general.json_query(lookup('ansible.builtin.vars',
      'ssl_exporter_enable', default='')) == 'true'"
  vars:
    ssl_exporter_enable: "[] | map(&enable || 'false', @) | [0]"
