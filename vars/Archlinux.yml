---
ssl_exporter_dest: '/opt/ssl_exporter'
ssl_exporter_conf_dest: '/etc/prometheus'
ssl_exporter_yaml_dest: '/etc/prometheus/ssl-exporter.yml'
ssl_exporter_options_dest: '/etc/prometheus/ssl-exporter.env'
ssl_exporter_bin: '/usr/bin/ssl_exporter'
ssl_exporter_service: 'prometheus-ssl-exporter'
ssl_exporter_package: 'prometheus-ssl-exporter'
ssl_exporter_packages_deps:
  - 'unzip'
  - 'tar'
